# ─── NovaGuard — Docker Compose Stack ───
#
# Serviços:
#   - api:         FastAPI (uvicorn, 4 workers)
#   - postgres:    PostgreSQL 16 + TimescaleDB
#   - redis:       Redis 7 (Cache + Celery Broker)
#   - worker:      Celery Worker (enrichment + sink queues)
#   - flower:      Celery Flower (monitoring UI)

services:
  # ── PostgreSQL + TimescaleDB ─────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novaguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novaguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-novaguard_db}
    ports:
      # Se houver conflito com um postgres local, altere para "5433:5432"
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (Cache + Broker) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ── FastAPI Application ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Aguardando socket do PostgreSQL (postgres:5432)...'
        while ! timeout 1s bash -c 'echo > /dev/tcp/postgres/5432' 2>/dev/null; do
          echo 'Postgres ainda não aceita conexões... aguardando 2s'
          sleep 2
        done
        echo '✓ Postgres acessível! Rodando migrações...'
        alembic upgrade head
        echo '✓ Migrações concluídas! Iniciando API...'
        uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4
      "

  # ── Celery Worker ────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "
        while ! timeout 1s bash -c 'echo > /dev/tcp/postgres/5432' 2>/dev/null; do
          sleep 2
        done
        celery -A backend.workers.celery_app worker --loglevel=info --concurrency=4 --queues=enrichment,sink --max-tasks-per-child=1000
      "

  # ── Celery Flower (Monitoring) ───────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.workers.celery_app flower --port=5555

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
