name: NovaGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  # Variáveis necessárias para importar os módulos sem infra real
  DATABASE_URL: "postgresql+asyncpg://novaguard:test@localhost:5432/novaguard_db"
  DATABASE_URL_SYNC: "postgresql+psycopg2://novaguard:test@localhost:5432/novaguard_db"
  REDIS_URL: "redis://localhost:6379/0"
  CELERY_BROKER_URL: "redis://localhost:6379/1"
  CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
  API_KEYS: '["ci-test-key-001"]'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Black (format check)
        run: black --check --diff .

      - name: Ruff (lint)
        run: ruff check .

      - name: MyPy (type check)
        run: mypy backend/ --ignore-missing-imports --no-error-summary || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov \
            --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
