name: NovaGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "postgresql+asyncpg://novaguard:novaguard_secret@localhost:5432/novaguard_db"
  DATABASE_URL_SYNC: "postgresql+psycopg2://novaguard:novaguard_secret@localhost:5432/novaguard_db"
  REDIS_URL: "redis://localhost:6379/0"
  CELERY_BROKER_URL: "redis://localhost:6379/1"
  CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
  API_KEYS: '["ci-test-key-001"]'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Black (format check)
        run: black --check --diff .

      - name: Ruff (lint)
        run: ruff check .

      - name: MyPy (type check)
        run: mypy backend/ --ignore-missing-imports --no-error-summary || true

  test:
    name: Tests & Schema Validation
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novaguard
          POSTGRES_PASSWORD: novaguard_secret
          POSTGRES_DB: novaguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate Alembic migrations
        run: alembic upgrade head

      - name: Verify schema integrity
        run: |
          python -c "
          from sqlalchemy import create_engine, inspect
          engine = create_engine('${{ env.DATABASE_URL_SYNC }}')
          tables = inspect(engine).get_table_names()
          print(f'Tables: {tables}')
          assert 'dns_logs' in tables, 'Missing table: dns_logs'
          assert 'threat_intel' in tables, 'Missing table: threat_intel'
          assert 'agent_registry' in tables, 'Missing table: agent_registry'
          print('Schema validation PASSED')
          "

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov \
            --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
